services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: testsk2-app:latest
    container_name: testsk2
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # 從 app 容器連 Qdrant 用服務名
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  # Qdrant 向量資料庫（供 SK 向量記憶 / RAG 使用）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  qdrant_data: {}
