services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: testsk2-app:latest
    container_name: testsk2
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # 從 app 容器連 MCP 用服務名（SSE 端點）
      - MCP_URL=http://mcp:8000
    depends_on:
      - qdrant
      - mcp
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  # FastMCP 讀檔 MCP 伺服器（供 SK 以 MCP plugin 呼叫）
  mcp:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    image: testsk2-mcp:latest
    container_name: mcp
    ports:
      - "8000:8000"
    volumes:
      - ./mcp_server/data:/data
    environment:
      - DATA_DIR=/data
      - MCP_SSE=1
      - MCP_PORT=8000

  # Qdrant 向量資料庫（供 SK 向量記憶 / RAG 使用）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  qdrant_data: {}
