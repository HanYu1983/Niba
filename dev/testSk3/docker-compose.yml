# F# 命令列開發環境（僅用 docker-compose，無 Dockerfile）
# 使用 volume 掛載本地目錄，編輯與執行皆在容器內

services:
  # Ollama 本機 LLM：安裝 ollama、拉取 qwen3.5:0.8b、啟動 API server（port 11434）
  # 啟動：docker compose up -d ollama
  # 本機存取：http://localhost:11434 （API 相容 OpenAI，可設 OPENROUTER_BASE_URL=http://host.docker.internal:11434/v1 給 run-sk）
  # OPENROUTER_BASE_URL=http://ollama:11434/v1
  # OPENROUTER_MODEL=qwen3.5:0.8b
  # OPENROUTER_API_KEY=anything
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    # 若有 NVIDIA GPU 可取消註解：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
  # GraphQL Server（F# + HotChocolate）
  # 啟動：docker compose up -d graphql
  # 本機存取：http://localhost:5000/graphql（Banana Cake Pop IDE）
  graphql:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ASPNETCORE_ENVIRONMENT=Development
    command: ["sh", "-c", "dotnet build HelloSk.GraphQL/HelloSk.GraphQL.fsproj && dotnet run --project HelloSk.GraphQL --no-build"]

  # 管理後台（F# Fable + Elmish + Feliz）
  # 啟動：docker compose up -d admin（建議先啟動 graphql：docker compose up -d graphql）
  # 本機存取：http://localhost:5173
  admin:
    build:
      context: .
      dockerfile: HelloSk.Admin/Dockerfile
    working_dir: /app/HelloSk.Admin
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - GRAPHQL_PROXY_TARGET=http://graphql:5000
    command: ["sh", "-c", "rm -rf src/fable_modules 2>/dev/null; npm install && dotnet tool restore && npm start"]
    depends_on:
      - graphql

  # 管理後台（Elm 前端，node 安裝 elm 編譯，無 Vite）
  # 啟動：docker compose up -d admin-elm（建議先啟動 graphql）
  # 本機存取：http://localhost:5174
  # platform: linux/amd64 讓 npm elm 可安裝預編譯二進位（官方無 linux_arm64）
  # docker compose run --rm admin-elm npm run build
  admin-elm:
    image: node:22
    platform: linux/amd64
    working_dir: /app/HelloSk.AdminElm
    volumes:
      - .:/app
    ports:
      - "5174:5174"
    environment:
      - GRAPHQL_PROXY_TARGET=http://graphql:5000/graphql
      - PORT=5174
    command: ["sh", "-c", "npm install && npm run build && npm start"]
    depends_on:
      - graphql

  # Qdrant 向量資料庫：供 RAG 使用
  # 啟動：docker compose up -d qdrant
  # 本機存取：http://localhost:6334
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  # 建置整個方案
  # 將HelloSk.sln_改為HelloSk.sln
  # docker-compose run --rm fsharp-dev dotnet build HelloSk.sln
  fsharp-dev:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: fsharp-dev
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: ["bash", "-c", "dotnet --version && echo '--- F# 開發環境就緒。可用: dotnet fsi, dotnet run, dotnet build ---' && exec bash"]

  # Semantic Kernel：使用 OpenRouter，需設定 OPENROUTER_API_KEY（.env 或 -e）
  # 執行範例（從 repo 根目錄 /app）：
  #   docker compose run --rm run-sk dotnet run --project HelloSk
  #   docker compose run --rm run-sk dotnet run --project HelloSk.Ask -- "你的問題"
  #   docker compose run --rm run-sk dotnet run --project HelloSk.Ask -- --aws "列出 S3 桶子"
  #   docker compose run --rm run-sk dotnet run --project HelloSk.Planner
  #   docker compose run --rm run-sk dotnet run --project HelloSk.Ask -- --chat
  #   docker compose run --rm --no-deps run-sk dotnet run --project HelloSk.Rag -- ./docs my_docs_collection
  #   docker compose run --rm run-sk dotnet run --project HelloSk.PdfToMd -- ./便利商店工作.pdf ./docs
  #   docker compose run --rm run-sk dotnet run --project HelloSk.GraphQL
  # 或常駐執行 GraphQL：docker compose up -d graphql → http://localhost:5000/graphql
  # 建置方案（需先將 HelloSk.sln_ 更名為 HelloSk.sln）：
  #   docker compose run --rm run-sk dotnet build HelloSk.sln
  # 執行測試：
  #   docker compose run --rm run-sk dotnet test HelloSk.Core.Tests
  # 建置專案：
  #   docker compose run --rm run-sk dotnet build HelloSk.Ask/HelloSk.Ask.fsproj
  # 查詢 Qdrant collection 中的點數：
  # curl http:/localhost:6333/collections/my_docs_collection6/points/count -H "Content-Type: application/json" -d '{"exact": true}'
  run-sk:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen3.5:0.8b}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-http://ollama:11434/v1}
      - OPENROUTER_EMBED_MODEL=${OPENROUTER_EMBED_MODEL:-openai/text-embedding-3-large}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - QDRANT_ENDPOINT=${QDRANT_ENDPOINT:-http://qdrant:6333}
    depends_on:
      - ollama
      - qdrant

volumes:
  ollama_data:
    # Ollama 模型與資料持久化
  qdrant_data:
    # Qdrant 資料持久化
