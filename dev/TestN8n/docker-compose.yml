services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./shared:/shared
    environment:
      # n8n 基本設定
      - N8N_HOST=0.0.0.0           # 監聽所有網路介面
      - N8N_PORT=5678              # n8n 服務埠號
      - N8N_PROTOCOL=http          # 使用 HTTP（開發環境無需 HTTPS）
      - WEBHOOK_URL=http://localhost:5678/  # Webhook 根網址
      - GENERIC_TIMEZONE=Asia/Taipei       # 設定時區為台北
      # 開發友善設置
      - N8N_SECURE_COOKIE=false    # 關閉 cookie 安全標誌，方便 HTTP 存取
      - N8N_DIAGNOSTICS_ENABLED=false  # 關閉匿名診斷數據收集
      # 授權本機寫檔
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared

  # 進入container後安裝pgvector extension
  # apt-get update && apt-get install -y postgresql-18-pgvector
  postgres:
    image: postgres:18
    environment:
      # psql -U n8n -h localhost -d n8n
      # n8n host 必須填這個service的名稱postgres
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=n8n
      - PGDATA=/var/lib/postgresql/18/docker
    volumes:
      # https://hub.docker.com/_/postgres
      # https://github.com/docker-library/postgres/pull/1259
      - ./postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  # Ollama 本機 LLM：安裝 ollama、拉取 qwen3.5:0.8b、啟動 API server（port 11434）
  # 啟動：docker compose up -d ollama
  # 本機存取：http://localhost:11434 （API 相容 OpenAI，可設 OPENROUTER_BASE_URL=http://host.docker.internal:11434/v1 給 run-sk）
  # OPENROUTER_BASE_URL=http://ollama:11434/v1
  # OPENROUTER_MODEL=qwen3.5:0.8b
  # OPENROUTER_API_KEY=anything
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama