services:
  clojure:
    image: clojure:temurin-21-tools-deps-bookworm
    working_dir: /work/game
    volumes:
      - ../clojure:/work
      # 持久化 Maven／tools.deps 快取，避免每次 run 都重新抓 jar（首次仍會下載）。
      - clojure-m2:/root/.m2
    # 在 GundamCard3 根目錄執行：
    # docker compose -f docker/docker-compose.local.yml run --rm clojure clojure -M -e "(require '[gundam.card3.core]) (gundam.card3.core/hello)"
    # docker compose -f docker/docker-compose.local.yml run --rm clojure clojure -M:test
    # docker compose -f docker/docker-compose.local.yml run --rm clojure clojure -M:run
    # docker compose -f docker/docker-compose.local.yml run --rm clojure clojure -M:nrepl
    # (load-file "src/app1/core2.cljc")
    # (in-ns 'app1.core2)
    # (-main 0)

volumes:
  clojure-m2:
