<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project18</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", sans-serif; margin: 16px; }
      .layout { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
      .panel { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
      .map { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
      .tile { border: 1px solid #e3e3e3; border-radius: 6px; padding: 6px; font-size: 12px; user-select: none; cursor: pointer; }
      .tile:hover { background: #f6f6f6; }
      .tile.kind-Event { border-color: #ffcc66; background: #fff8e6; }
      .tile.kind-City { border-color: #77c5ff; background: #eef8ff; }
      .player { border: 1px solid #e3e3e3; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 12px; cursor: pointer; }
      .player:hover { background: #f6f6f6; }
      .muted { color: #666; font-size: 12px; }
      .info-panel { border: 1px solid #e3e3e3; border-radius: 6px; padding: 8px; font-size: 12px; margin: 8px 0 12px; }
      .active-menu-title { font-size: 12px; margin: 6px 0; }
      .menu-node { padding-left: 8px; margin: 6px 0; border-left: 2px solid #f0f0f0; }
      .menu-caption { font-size: 12px; color: #444; margin: 2px 0; }
      .menu-entry { font-size: 12px; padding: 4px 6px; margin: 2px 4px 2px 0; }
      .menu-form { margin: 4px 0; }
      .menu-slider { margin: 6px 0; }
      .menu-children { margin-left: 8px; }
    </style>
  </head>
  <body>
    <div class="muted">開啟 DevTools Console 可看 trace。</div>
    <div class="layout">
      <div class="panel">
        <div><b>Map</b></div>
        <div id="app-map"></div>
      </div>
      <div class="panel">
        <div><b>Info</b></div>
        <div id="app-info"></div>
        <hr />
        <div><b>Menu</b></div>
        <div id="app-menu"></div>
        <hr />
        <div><b>Players</b></div>
        <div id="app-players"></div>
      </div>
    </div>

    <script defer src="bin/hello.js"></script>
  </body>
  </html>
