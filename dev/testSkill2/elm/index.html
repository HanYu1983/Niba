<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>The Silence Protocol</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Consolas', 'Monaco', monospace;
      min-height: 100vh;
      padding: 12px;
    }
    .app { max-width: 1200px; margin: 0 auto; }
    .title {
      color: #58a6ff;
      font-size: 1.25rem;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .layout {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-width: 320px;
    }
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 280px;
    }
    .view-map {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .zone {
      padding: 12px;
      min-height: 80px;
      border-radius: 4px;
      border: 1px solid #30363d;
    }
    .zone--chaos {
      background: linear-gradient(135deg, #3d1a2a 0%, #1a2a3d 50%, #2a3d1a 100%);
      color: #ff7b72;
    }
    .zone--stabilized {
      background: #161b22;
      color: #8b949e;
    }
    .zone--flattened {
      background: #21262d;
      color: #6e7681;
    }
    .zone-name { font-weight: 600; margin-bottom: 4px; }
    .zone-state { font-size: 0.85rem; opacity: 0.9; }
    .view-metrics {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 12px;
    }
    .metrics-row { margin: 4px 0; font-size: 0.9rem; }
    .view-controls {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 12px;
    }
    .phase-display { margin-bottom: 8px; font-size: 0.9rem; }
    .command-panel { display: flex; flex-direction: column; gap: 8px; }
    .command-title { font-size: 0.85rem; margin-bottom: 4px; }
    .command-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn {
      background: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
    }
    .btn:hover { background: #30363d; }
    .btn-command { font-size: 0.8rem; padding: 6px 10px; }
    .view-log {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-title { font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    .log-line { font-size: 0.8rem; margin: 2px 0; color: #8b949e; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
    const app = Elm.Main.init({ node: document.getElementById("app") });
  </script>
</body>
</html>
