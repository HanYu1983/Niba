version: '3.8'

services:
  # docker-compose up --build
  # docker exec -it testtrae-graphql-server-1 sh
  graphql-server:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /usr/src/app
    command: sh -c 'npm install && npm run start'
    ports:
      - "4000:4000"
    volumes:
      - .:/usr/src/app
    environment:
      - NODE_ENV=development
