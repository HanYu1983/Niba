<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>未命名的機甲戰棋 — 大廳</title>
  <style>
    body { font-family: sans-serif; margin: 1rem; background: #1a1a2e; color: #eee; }
    .lobby { max-width: 800px; }
    .balance { font-size: 1.2rem; font-weight: bold; color: #aaccff; }
    .shop, .inventory { margin-top: 1rem; }
    .shop-section { margin: 1rem 0; padding: 0.5rem; background: #16213e; border-radius: 8px; }
    .shop-section h3 { margin-top: 0; color: #e94560; }
    .item-list { list-style: none; padding-left: 0; }
    .item-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid #0f3460; }
    .item-row span { margin-right: 0.25rem; }
    .btn { padding: 0.35rem 0.75rem; cursor: pointer; background: #e94560; color: #fff; border: none; border-radius: 4px; }
    .btn:hover:not(:disabled) { background: #ff6b6b; }
    .btn:disabled { background: #555; cursor: not-allowed; color: #999; }
    .btn-primary { background: #e94560; }
    .btn-primary:hover:not(:disabled) { background: #ff6b6b; }
    .btn-small { padding: 0.2rem 0.5rem; font-size: 0.9rem; }
    .btn-assembly { background: #0f3460; }
    .btn-assembly:hover { background: #1a4a7a; }
    .assembly-block { margin: 0.5rem 0; padding: 1rem; background: #16213e; border-radius: 8px; border: 1px solid #0f3460; }
    @media (max-width: 640px) { .assembly-block--two-col { grid-template-columns: 1fr !important; } }
    .assembly-block h3 { color: #aaccff; margin-top: 0.5rem; }
    .assembly-current { margin-bottom: 1rem; }
    .assembly-equip { margin-top: 1rem; }
    .pilot-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .assembly-legal { color: #7bed9f; }
    .assembly-illegal { color: #ff6b6b; }
    .squad-block { margin-top: 0.5rem; }
    .strategy { max-width: 800px; }
    .strategy .btn { margin-right: 0.5rem; margin-bottom: 0.5rem; }
    .mission-detail { margin-top: 1rem; }
    /* ---- Combat (ref: core/combat_ui.md) ---- */
    .combat { max-width: 100%; padding: 0 1rem; }
    .combat-header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #0f3460; }
    .combat-header .btn-back { background: #0f3460; }
    .combat-header .btn-back:hover { background: #1a4a7a; }
    .combat-title { margin: 0; font-size: 1.25rem; color: #aaccff; }
    .combat-meta { display: flex; gap: 1rem; font-size: 0.95rem; }
    .combat-round { color: #ccc; }
    .combat-phase { font-weight: bold; }
    .combat-phase--player { color: #7bed9f; }
    .combat-phase--enemy { color: #ff6b6b; }
    .combat-result { text-align: center; padding: 2rem; }
    .combat-result .result { margin: 0 0 1rem; font-size: 1.5rem; font-weight: bold; }
    .combat-result .result.victory { color: #7bed9f; }
    .combat-result .result.defeat { color: #ff6b6b; }
    .combat-active { margin-top: 0; }
    .combat-body { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
    .combat-map-wrap { margin: 0; }
    .combat-grid { font-family: monospace; flex-shrink: 0; }
    .combat-grid .cell {
      display: flex; align-items: center; justify-content: center;
      min-width: 0; min-height: 0;
      background: #0f3460; border-radius: 4px;
      font-size: 0.7rem; transition: background 0.15s, box-shadow 0.15s;
      position: relative; overflow: hidden;
    }
    .combat-grid .cell--reachable { background: #2a5a8e; cursor: pointer; }
    .combat-grid .cell--reachable:hover { background: #3a6a9e; }
    .combat-grid .cell--current-unit { box-shadow: 0 0 0 2px #aaccff, 0 0 8px rgba(170,204,255,0.3); }
    .combat-grid .cell--player { background: #1a4a6a; color: #7bed9f; }
    .combat-grid .cell--player.cell--current-unit { background: #2a5a8a; }
    .combat-grid .cell--enemy { background: #4a2a2a; color: #ff8a8a; }
    .combat-grid .cell--enemy.cell--current-unit { background: #5a3a3a; }
    .combat-grid .cell--finished { filter: grayscale(0.8); opacity: 0.85; }
    .combat-grid .cell--attack-range { border: 1px dashed rgba(255,200,100,0.6); }
    .combat-grid .cell-empty { color: #3a5a7a; font-size: 0.85rem; }
    .combat-grid .cell-dot { color: rgba(170,204,255,0.7); font-size: 0.75rem; }
    .combat-grid .cell-unit {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; line-height: 1.1; padding: 1px 0 0;
    }
    .combat-grid .cell-unit-mark { font-weight: bold; font-size: 0.8rem; }
    .combat-grid .cell-unit-hp { font-size: 0.6rem; opacity: 0.95; }
    .combat-grid .cell-unit-hp-bar-wrap {
      position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: rgba(0,0,0,0.4); overflow: hidden;
    }
    .combat-grid .cell-unit-hp-bar {
      height: 100%; background: #7bed9f; border-radius: 0; min-width: 1px;
      transition: width 0.2s;
    }
    .combat-grid .cell--enemy .cell-unit-hp-bar { background: #ff8a8a; }
    .combat-panel { flex: 1; min-width: 260px; padding: 1rem; background: #16213e; border-radius: 8px; border: 1px solid #0f3460; }
    .combat-action-menu { margin-bottom: 1rem; }
    .combat-action-menu-title { margin: 0 0 0.5rem; font-size: 0.95rem; color: #aaccff; }
    .combat-action-buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .combat-action-hint { font-size: 0.85rem; color: #aaa; margin-right: 0.5rem; }
    .btn-action { padding: 0.3rem 0.6rem; font-size: 0.9rem; background: #0f3460; }
    .btn-action:hover:not(:disabled) { background: #1a4a7a; }
    .btn-end { background: #2d5a2d; }
    .btn-end:hover:not(:disabled) { background: #3d6a3d; }
    .combat-unit-brief { margin-bottom: 1rem; padding: 0.75rem 0; border-top: 1px solid #0f3460; border-bottom: 1px solid #0f3460; }
    .combat-unit-brief-title { margin: 0 0 0.5rem; font-size: 0.95rem; color: #aaccff; }
    .combat-unit-name { margin: 0 0 0.35rem; font-weight: bold; }
    .combat-unit-hp-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.25rem 0; }
    .combat-unit-hp-label { font-size: 0.85rem; color: #aaa; min-width: 1.5rem; }
    .combat-unit-hp-bar-wrap { flex: 1; height: 6px; background: #0f3460; border-radius: 3px; overflow: hidden; }
    .combat-unit-hp-bar { height: 100%; background: #7bed9f; border-radius: 2px; min-width: 2px; transition: width 0.2s; }
    .combat-unit-hp-nums { font-size: 0.85rem; color: #ccc; }
    .combat-unit-en, .combat-unit-weapon { margin: 0.2rem 0; font-size: 0.9rem; color: #ccc; }
    .combat-unit-status { margin-bottom: 1rem; }
    .combat-unit-status-title { margin: 0 0 0.35rem; font-size: 0.9rem; color: #aaccff; }
    .combat-unit-status ul { margin: 0.25rem 0; padding-left: 1.25rem; font-size: 0.85rem; color: #bbb; }
    .combat-targets-title { margin: 0 0 0.5rem; font-size: 0.95rem; color: #aaccff; }
    .combat-targets-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .btn-target { background: #8b2a2a; }
    .btn-target:hover { background: #9b3a3a; }
    .combat-no-unit { margin: 0 0 0.5rem; color: #aaa; }
    .result.victory { color: #7bed9f; font-size: 1.2rem; font-weight: bold; }
    .result.defeat { color: #ff6b6b; font-size: 1.2rem; font-weight: bold; }
    /* Modal / 攻擊結果面板 (ref: combat_ui.md §2.4) */
    .combat-modal-backdrop {
      position: fixed; left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex; align-items: flex-start; justify-content: center;
      padding-top: 3rem; z-index: 100;
    }
    .combat-modal {
      background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
      padding: 1.25rem; min-width: 280px; max-width: 90vw; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .combat-modal-title { margin: 0 0 0.75rem; font-size: 1rem; color: #aaccff; }
    .combat-modal-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .combat-attack-result-panel .combat-modal-title { font-size: 0.95rem; }
    .combat-attack-result-outcome { margin: 0.35rem 0; font-size: 1.1rem; font-weight: bold; color: #eee; }
    .combat-attack-result-damage { margin: 0.25rem 0; font-size: 1rem; color: #ff8a8a; }
    .combat-attack-result-crit { display: inline-block; margin-left: 0.5rem; padding: 0.15rem 0.4rem; font-size: 0.8rem; background: #e94560; border-radius: 4px; color: #fff; }
    .combat-attack-result-note { margin: 0.2rem 0; font-size: 0.85rem; color: #aaa; }
    .combat-attack-result-dismiss { margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
    const app = Elm.Main.init({ node: document.getElementById("app") });
  </script>
</body>
</html>
