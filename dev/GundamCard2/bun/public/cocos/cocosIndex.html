<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <title>Game</title>

  <meta name="viewport"
    content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="full-screen" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />

  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

  <link rel="stylesheet" type="text/css" href="./style.css" />
  <link rel="icon" href="favicon.ico" />
</head>

<body>
  <div id="GameDiv" cc_exact_fit_screen="true" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;">
    <div id="GameContainer">
      <canvas id="GameCanvas" width="1280" height="960" tabindex="99"></canvas>
    </div>
  </div>

  <script src="src/polyfills.bundle.js" charset="utf-8"> </script>


  <!-- SystemJS support. -->
  <script src="src/system.bundle.js" charset="utf-8"> </script>

  <!-- Import map -->
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

  <script>
    System.import('./index.js').catch(function (err) { console.error(err); })

    // postMessage method for communication with parent window or other windows
    function callParent(data) {
      if (window.parent && window.parent !== window) {
        console.log('向 parent 發送消息:', data);
        window.parent.postMessage(data, "*");
      }
    }

    window['html'] = {
      callParent: callParent
    }

    // 監聽來自 parent 的 postMessage
    window.addEventListener('message', function(event) {
      // 驗證來源（可選但推薦）
      // if (event.origin !== window.location.origin) return;

      const data = event.data;
      console.log('收到來自 parent 的消息:', data);

      if(window['cocos']){
        // 假設 cocos 有一個方法可以處理消息
        window['cocos'].receiveMessage(data);
      }

      // 根據消息類型處理
      if (data.type === 'command') {
        console.log('執行命令:', data.command);
        // 處理命令邏輯
      } else if (data.type === 'config') {
        console.log('更新配置:', data.config);
        // 處理配置邏輯
      }
      // 可在此添加其他消息類型的處理
    });

  </script>
</body>

</html>
