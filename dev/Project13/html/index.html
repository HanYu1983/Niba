<body>
  <div class="center">
    <div id="canvas"></div>
  </div>
  <button onclick="window.openAppStore()">openAppStore</button>

  <script>
    app = {}
  </script>
  <script src="./js/app.config.js"></script>
  <script src="./js/app.spec.js"></script>
  <script src="./js/app.view.js"></script>
  <script src="./js/app.game.js"></script>
  <script src="./js/app.messaging.js?version=1"></script>
  <script type="module">
    import * as easing from "./js/easing.js"
    window.Easing = easing

    import * as firebase from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js"
    import * as messaging from "https://www.gstatic.com/firebasejs/11.3.1/firebase-messaging.js"
    window.Firebase = {
      app: firebase,
      messaging: messaging
    }
    async function main() {
      const config = await app.config
      const view = await app.view
      const game = await app.game
      const spec = await app.spec
      const messaging = await app.messaging
      view.create("canvas")
      game.startGame()
      //await messaging.startMessaing()
      view.onSetup.subscribe(p => {
        const button = p.createButton('click me');
        button.position(0, 100);
        button.mousePressed(() => {
          alert("mousePressed")
          messaging.startMessaing().catch(alert)
        });
      })
    }
    main().catch(console.error)
  </script>
  <script>
    // 以下代碼要配合p5針對canvas的width,height為100%
    // example
    // const canvas = p.createCanvas(W, H, p.WEBGL);
    // p.camera(W / 2, H / 2, 800, W / 2, H / 2, 0)
    // p.frameRate(60)
    // p.ortho()
    // canvas.style('width', "100%")
    // canvas.style('height',  "100%")
    function resizeCanvas() {
      const canvas = document.getElementById('canvas');
      const aspectRatio = 1080 / 1920;
      const width = window.innerWidth;
      const height = window.innerHeight;
      // 計算新的寬度和高度
      if (width / height > aspectRatio) {
        canvas.style.width = height * aspectRatio + 'px';
        canvas.style.height = height + 'px';
      } else {
        canvas.style.width = width + 'px';
        canvas.style.height = width / aspectRatio + 'px';
      }
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);
  </script>

</html>
